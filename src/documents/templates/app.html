<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archiv</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%230e7c74'/%3E%3Crect x='10' y='9' width='12' height='2' rx='1' fill='white'/%3E%3Crect x='10' y='14' width='12' height='2' rx='1' fill='white'/%3E%3Crect x='10' y='19' width='7' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#15202b; --muted:#66727f; --line:#e2e6ea;
  --h:176; --accent:hsl(var(--h) 80% 26%); --accent-ink:#fff; --accent-soft:hsl(var(--h) 36% 91%); --danger:#b3261e;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.06);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f151b; --surface:#171f27; --ink:#e8edf2; --muted:#8c99a6; --line:#26313b;
    --accent:hsl(var(--h) 53% 46%); --accent-ink:#04201d; --accent-soft:hsl(var(--h) 36% 15%); --danger:#f2918a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
}
:root[data-theme="dark"]{--bg:#0f151b; --surface:#171f27; --ink:#e8edf2; --muted:#8c99a6; --line:#26313b;
  --accent:hsl(var(--h) 53% 46%); --accent-ink:#04201d; --accent-soft:hsl(var(--h) 36% 15%); --danger:#f2918a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:550}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
input[type=text],input[type=password],input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth form{width:min(380px,100%);background:var(--surface);padding:28px;border-radius:14px;box-shadow:var(--shadow);display:grid;gap:14px}
.auth h1{margin:0;font-size:22px;letter-spacing:-.01em}
.auth p{margin:0;color:var(--muted)}
.err{color:var(--danger);min-height:1.4em;font-size:14px}

/* shell */
.shell{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
nav{overflow:auto;padding:6px 10px;flex:1}
.nav-h{display:flex;justify-content:space-between;align-items:center;padding:14px 10px 4px;color:var(--muted);font-size:13px;font-weight:600}
.nav-h button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.nav-h button:hover{background:var(--accent-soft);color:var(--accent)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .n{margin-left:auto;color:var(--muted);font-size:13px}
.sys{border-top:1px solid var(--line);padding:8px 10px;display:grid;gap:2px}
.bar.min{display:none}
.card.static{cursor:default}.card.static:hover{border-color:transparent}
.tact{display:grid;gap:6px;padding:0 12px 12px}
.tact .btn{justify-content:center;padding:6px 8px;font-size:14px}
#page{padding-top:18px}
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.subnav{display:grid;gap:2px;align-content:start}
.panelbox{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:grid;gap:16px;max-width:620px}
.panelbox h3{margin:0;font-size:17px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--muted);margin-top:5px}
.field select{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.panelbox .act{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.me{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:6px}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.me div{display:flex;gap:6px}
.me .btn{padding:6px 10px;font-size:14px}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;gap:10px;padding:16px 24px;align-items:center}
.bar .search{flex:1;max-width:560px}
.bar select{padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.menu-btn{display:none}
.scroll{overflow:auto;padding:4px 24px 32px;flex:1}
.crumb{display:flex;align-items:baseline;gap:10px;margin:4px 0 14px}
.crumb h2{margin:0;font-size:20px;letter-spacing:-.01em}
.crumb span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;font-size:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:1px solid transparent;text-align:left;padding:0}
.card:hover{border-color:var(--accent)}
.card .meta{padding:6px 8px}.card .meta b{font-size:14px}.card small{font-size:12px}
.thumb{aspect-ratio:3/4;background:var(--bg) center top/cover no-repeat;border-bottom:1px solid var(--line)}
.meta{padding:10px 12px 12px;display:grid;gap:6px}
.meta b{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.meta small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.chip .dot{width:7px;height:7px}
.chip.type{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.meta small.who{color:var(--ink);font-weight:550}
.hint{color:var(--muted);padding:4px 10px 6px;font-size:14px;margin:0}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters select{padding:7px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:0;max-width:100%}
.filters select.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.hue{width:100%;height:12px;appearance:none;border-radius:6px;border:0;background:linear-gradient(90deg,hsl(0 70% 45%),hsl(60 70% 45%),hsl(120 70% 38%),hsl(180 70% 38%),hsl(240 70% 55%),hsl(300 70% 45%),hsl(360 70% 45%));outline-offset:4px}
.hue::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--muted)}
.hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--muted)}
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ent{display:flex;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.ent .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:14px 16px;border-radius:var(--r)}
.ent .open .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .open .n{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.ent .edit{border:0;background:none;color:var(--muted);padding:8px 12px;margin-right:4px;border-radius:6px}
.ent .edit:hover{background:var(--accent-soft);color:var(--accent)}
.ent:hover{outline:1px solid var(--accent)}
.navrow{display:flex;align-items:center}
.navrow .item{flex:1;min-width:0}
.navrow .edit{border:0;background:none;color:var(--muted);opacity:0;padding:4px 8px;border-radius:6px;margin-left:2px}
.navrow:hover .edit,.navrow:focus-within .edit{opacity:1}
.navrow .edit:hover{background:var(--accent-soft);color:var(--accent)}
.side select{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
dialog select{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:80px 20px;gap:10px}
.empty b{color:var(--ink);font-size:17px}
.more{display:block;margin:24px auto 0}

/* drop overlay */
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--accent-ink);display:none;place-items:center;font-size:26px;font-weight:700;z-index:50;letter-spacing:-.01em}
.drop.on{display:grid}
.drop div{border:3px dashed currentColor;border-radius:20px;padding:48px 72px}

/* detail panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;z-index:30;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr}
.panel.on{transform:none;visibility:visible;transition:transform .22s ease}
.panel-h{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h .sp{flex:1}
.tabs{display:flex;gap:2px;margin-left:8px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.pane{min-height:0;min-width:0;display:grid}
.pane>*{grid-area:1/1}
.pane .txt{margin:0;padding:18px 20px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);user-select:text}
.pane .txt.none{color:var(--muted);font-family:inherit}
.pane [hidden]{display:none}
.panel-b{display:grid;grid-template-columns:1fr 260px;min-height:0}
.panel-b iframe,.panel-b img.pv{width:100%;height:100%;border:0;background:var(--bg);object-fit:contain}
.side{border-left:1px solid var(--line);padding:16px;overflow:auto;display:grid;gap:14px;align-content:start}
.side label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tagpick button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.veil{position:fixed;inset:0;background:rgba(10,16,22,.4);z-index:25;display:none}
.veil.on{display:block}

/* dialogs & toast */
dialog{border:0;border-radius:14px;padding:22px;width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,22,.45)}
dialog h3{margin:0 0 14px}
dialog .row{display:grid;gap:10px}
dialog .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.users{display:grid;gap:6px;margin-bottom:14px}
.users div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.users div span{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors input{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer}
.colors input:checked{border-color:var(--ink)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .2s}
  aside.on{transform:none}
  .menu-btn{display:inline-flex}
  .navrow .edit{opacity:1}
  .bar.min{display:flex}.bar.min>:not(.menu-btn){display:none}
  .set{grid-template-columns:1fr;gap:14px}.subnav{grid-auto-flow:column;overflow:auto}
  .panel-b{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{border-left:0;border-top:1px solid var(--line);max-height:46vh}
  .bar{padding:12px 14px;flex-wrap:wrap}.bar .search{order:5;flex:1 1 100%;max-width:none}.bar select{flex:1;min-width:0}
  .scroll{padding:4px 14px 28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="drop" id="drop"><div>Dateien hier ablegen, um sie hochzuladen</div></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#0e7c74","#2f6fdb","#7a4bd8","#c2418f","#d4542b","#c58a0a","#4d8a2e","#5b6b7b"];

const state = { user: null, csrf: "", tags: [], corrs: [], types: [], docs: [], next: null, total: 0,
  tag: null, corr: null, dtype: null, untagged: false, view: "docs", pageSize: 30, trashN: 0, settingsTab: "general", query: "", ordering: "-created", loading: false, open: null, pending: 0 };

async function api(path, opts = {}) {
  const o = { credentials: "same-origin", ...opts, headers: { "X-CSRFToken": state.csrf, ...(opts.headers || {}) } };
  if (opts.json !== undefined) { o.body = JSON.stringify(opts.json); o.headers["Content-Type"] = "application/json"; }
  const r = await fetch("/api" + path, o);
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) {
    const e = new Error(extractError(data) || "Anfrage fehlgeschlagen (" + r.status + ")");
    e.status = r.status; throw e;
  }
  return data;
}
function extractError(d) {
  if (!d) return "";
  if (typeof d === "string") return d;
  if (d.detail) return d.detail;
  return Object.entries(d).map(([k, v]) => (Array.isArray(v) ? v.join(" ") : v)).join(" ");
}
function toast(msg) {
  const t = h(`<div class="toast" role="status">${esc(msg)}</div>`); document.body.append(t); setTimeout(() => t.remove(), 3200);
}
const fmtDate = (s) => s ? new Date(s).toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" }) : "";

/* ---------- auth screens ---------- */
function authScreen(setup) {
  const root = $("#root"); root.innerHTML = "";
  const el = h(`<div class="auth"><form>
    <h1>${setup ? "Konto einrichten" : "Anmelden"}</h1>
    <p>${setup ? "Lege das erste Konto an. Es wird Administrator." : "Melde dich an, um dein Archiv zu öffnen."}</p>
    <input type="text" name="username" placeholder="Benutzername" autocomplete="username" required autofocus>
    <input type="password" name="password" placeholder="Passwort${setup ? " (mind. 8 Zeichen)" : ""}" autocomplete="${setup ? "new-password" : "current-password"}" required>
    <div class="err" role="alert"></div>
    <button class="btn primary" style="justify-content:center">${setup ? "Konto anlegen" : "Anmelden"}</button>
  </form></div>`);
  $("form", el).addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    try {
      const r = await api(setup ? "/auth/setup/" : "/auth/login/", { method: "POST", json: Object.fromEntries(f) });
      state.user = r.user; state.csrf = r.csrf; await start();
    } catch (e) { $(".err", el).textContent = e.message; }
  });
  root.append(el);
}

/* ---------- app shell ---------- */
function shell() {
  const root = $("#root"); root.innerHTML = "";
  const el = h(`<div class="shell">
    <aside id="aside">
      <div class="brand"><i><svg viewBox="0 0 16 16"><path d="M4 5h8M4 8h8M4 11h5"/></svg></i>Archiv</div>
      <nav id="nav"></nav>
      <div class="sys">
        <button class="item" id="trashBtn"><span class="nm">Papierkorb</span><span class="n" id="trashN"></span></button>
        <button class="item" id="settingsBtn"><span class="nm">Einstellungen</span></button></div>
      <div class="me"><span>${esc(state.user.username)}</span><div>
        <button class="btn" id="logoutBtn">Abmelden</button></div></div>
    </aside>
    <main>
      <div class="bar">
        <button class="btn ghost menu-btn" id="menuBtn" aria-label="Menü">☰</button>
        <input class="search" type="search" id="q" placeholder="Dokumente und Inhalte durchsuchen" aria-label="Suche">
        <select id="sort" aria-label="Sortierung">
          <option value="-created">Neueste zuerst</option><option value="created">Älteste zuerst</option>
          <option value="-added">Zuletzt hinzugefügt</option><option value="title">Titel A–Z</option>
        </select>
        <label class="btn primary" for="file">Hochladen</label>
        <input id="file" type="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp,.gif,.txt,.doc,.docx,.odt">
      </div>
      <div class="scroll" id="scroll"><div id="docsView"><div class="crumb" id="crumb"></div><div class="filters" id="filters"></div><div id="list"></div></div><div id="page" hidden></div></div>
    </main>
    <div class="veil" id="veil"></div>
    <section class="panel" id="panel" aria-label="Dokument"></section>
  </div>`);
  root.append(el);

  $("#logoutBtn").onclick = async () => { await api("/auth/logout/", { method: "POST" }); location.reload(); };
  $("#trashBtn").onclick = () => setView("trash");
  $("#settingsBtn").onclick = () => setView("settings");
  $("#menuBtn").onclick = () => $("#aside").classList.toggle("on");
  $("#sort").onchange = (e) => { state.ordering = e.target.value; reload(); };
  let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.query = e.target.value.trim(); reload(); }, 250); };
  $("#file").onchange = (e) => { upload([...e.target.files]); e.target.value = ""; };
  $("#veil").onclick = closePanel;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
}

const KINDS = {
  tag:  { api: "/tags/",           list: "tags",  title: "Tags",            one: "Tag",           st: "tag",   none: "Noch keine Tags." },
  corr: { api: "/correspondents/", list: "corrs", title: "Korrespondenten", one: "Korrespondent", st: "corr",  none: "Noch keine Korrespondenten." },
  type: { api: "/document_types/", list: "types", title: "Dokumenttypen",   one: "Dokumenttyp",   st: "dtype", none: "Noch keine Dokumenttypen." },
};
function renderNav() {
  const nav = $("#nav"); if (!nav) return;
  const docs = state.view === "docs", filt = state.tag || state.corr || state.dtype;
  const idle = !filt && !state.untagged && docs;
  const entry = (k) => `<button class="item ${state.view === k ? "on" : ""}" data-view="${k}"><span class="nm">${KINDS[k].title}</span><span class="n">${state[KINDS[k].list].length || ""}</span></button>`;
  nav.innerHTML = `<button class="item ${idle ? "on" : ""}" data-all="1">Alle Dokumente</button>
    <button class="item ${state.untagged && docs ? "on" : ""}" data-none="1">Posteingang</button>
    <div class="nav-h">Verwalten</div>` + entry("tag") + entry("corr") + entry("type");
  nav.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.view) return setView(b.dataset.view);
    if (b.dataset.all) { state.tag = state.corr = state.dtype = null; state.untagged = false; }
    else if (b.dataset.none) { state.tag = state.corr = state.dtype = null; state.untagged = true; }
    else return;
    setView("docs"); reload();
  };
}

function renderFilters() {
  const f = $("#filters"); if (!f) return;
  const sel = (id, label, items, cur) => `<select id="${id}" class="${cur ? "on" : ""}" aria-label="${label}"><option value="">${label}</option>${items.map(t => `<option value="${t.id}" ${t.id === cur ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>`;
  f.innerHTML = sel("fTag", "Alle Tags", state.tags, state.tag) + sel("fCorr", "Alle Korrespondenten", state.corrs, state.corr) + sel("fType", "Alle Dokumenttypen", state.types, state.dtype)
    + (state.tag || state.corr || state.dtype || state.untagged ? '<button class="btn ghost" id="fReset">Filter zurücksetzen</button>' : "");
  const set = (k, v) => { state[k] = v ? +v : null; if (k === "tag" && v) state.untagged = false; renderFilters(); renderNav(); reload(); };
  $("#fTag").onchange = (e) => set("tag", e.target.value);
  $("#fCorr").onchange = (e) => set("corr", e.target.value);
  $("#fType").onchange = (e) => set("dtype", e.target.value);
  const r = $("#fReset"); if (r) r.onclick = () => { state.tag = state.corr = state.dtype = null; state.untagged = false; renderFilters(); renderNav(); reload(); };
}

function renderEntities(k) {
  const K = KINDS[k], items = state[K.list], page = $("#page");
  page.innerHTML = `<div class="crumb"><h2>${K.title}</h2><span>${items.length}</span><span style="flex:1"></span>
      <button class="btn primary" id="addEnt">${K.one} anlegen</button></div>
    ${items.length ? `<div class="ents">${items.map(t => `<div class="ent">
        <button class="open" data-id="${t.id}">${k === "tag" ? `<i class="dot" style="background:${esc(t.color)}"></i>` : ""}<span class="nm">${esc(t.name)}</span>
          <span class="n">${t.document_count} ${t.document_count === 1 ? "Dokument" : "Dokumente"}</span></button>
        <button class="edit" data-edit="${t.id}" aria-label="${esc(t.name)} bearbeiten" title="Bearbeiten">✎</button></div>`).join("")}</div>`
      : `<div class="empty"><b>${K.none}</b><span>Lege oben rechts den ersten an.</span></div>`}`;
  page.onclick = (e) => {
    if (e.target.closest("#addEnt")) return entityDialog(k);
    const ed = e.target.closest("[data-edit]");
    if (ed) return entityDialog(k, items.find(t => t.id === +ed.dataset.edit));
    const o = e.target.closest(".open");
    if (o) { state.tag = state.corr = state.dtype = null; state.untagged = false; state[K.st] = +o.dataset.id; setView("docs"); reload(); }
  };
}

function setView(v) {
  state.view = v;
  $("#docsView").hidden = v !== "docs"; $("#page").hidden = v === "docs";
  $(".bar").classList.toggle("min", v !== "docs");
  $("#trashBtn").classList.toggle("on", v === "trash"); $("#settingsBtn").classList.toggle("on", v === "settings");
  $("#aside").classList.remove("on"); renderNav();
  closePanel();
  if (v === "trash") renderTrash(); else if (v === "settings") renderSettings();
  else if (KINDS[v]) renderEntities(v);
  if (v === "docs") renderFilters();
}

/* ---------- documents ---------- */
function params(page) {
  const p = new URLSearchParams({ page, page_size: state.pageSize, ordering: state.ordering });
  if (state.tag) p.set("tags", state.tag);
  if (state.untagged) p.set("untagged", "1");
  if (state.corr) p.set("correspondent", state.corr);
  if (state.dtype) p.set("document_type", state.dtype);
  if (state.query) { p.set("query", state.query); p.delete("ordering"); }
  return p;
}
async function reload() { state.docs = []; state.next = 1; state.total = 0; await more(true); }
async function more(reset) {
  if (state.loading || !state.next) return; state.loading = true;
  try {
    const r = await api("/documents/?" + params(state.next));
    state.docs = state.docs.concat(r.results); state.total = r.count;
    state.next = r.next ? state.next + 1 : null; renderList();
  } catch (e) { toast(e.message); }
  state.loading = false;
}
const nameOf = (list, id) => (list.find(x => x.id === id) || {}).name || "";
const opts = (list, sel) => list.map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}</option>`).join("");
function docChips(d) {
  const t = d.document_type ? `<span class="chip type">${esc(nameOf(state.types, d.document_type))}</span>` : "";
  return t + tagChips(d.tags);
}
function tagChips(ids) {
  return ids.map(id => state.tags.find(t => t.id === id)).filter(Boolean)
    .map(t => `<span class="chip"><i class="dot" style="background:${esc(t.color)}"></i>${esc(t.name)}</span>`).join("");
}
function renderList() {
  const parts = [];
  if (state.untagged) parts.push("Posteingang");
  if (state.tag) parts.push(nameOf(state.tags, state.tag));
  if (state.corr) parts.push(nameOf(state.corrs, state.corr));
  if (state.dtype) parts.push(nameOf(state.types, state.dtype));
  const cur = parts.filter(Boolean).join(" · ") || "Alle Dokumente";
  $("#crumb").innerHTML = `<h2>${esc(cur)}</h2><span>${state.total} ${state.total === 1 ? "Dokument" : "Dokumente"}${state.query ? " gefunden" : ""}</span>
    ${state.pending ? `<span>· ${state.pending} werden verarbeitet …</span>` : ""}`;
  const list = $("#list");
  if (!state.docs.length) {
    list.innerHTML = state.query
      ? `<div class="empty"><b>Nichts gefunden</b><span>Prüfe die Schreibweise oder suche nach einem anderen Wort.</span></div>`
      : `<div class="empty"><b>Hier ist noch nichts</b><span>Ziehe PDFs oder Scans in dieses Fenster. Texterkennung und Tags laufen automatisch.</span>
         <label class="btn primary" for="file">Dateien auswählen</label></div>`;
    return;
  }
  list.innerHTML = `<div class="grid">${state.docs.map(d => `
    <button class="card" data-id="${d.id}">
      <div class="thumb" style="background-image:url('/api/documents/${d.id}/thumb/')"></div>
      <div class="meta"><b>${esc(d.title || d.original_filename)}</b>${d.correspondent ? `<small class="who">${esc(nameOf(state.corrs, d.correspondent))}</small>` : ""}<small>${fmtDate(d.created)}${d.page_count ? " · " + d.page_count + " S." : ""}</small>
      <div class="chips">${docChips(d)}</div></div></button>`).join("")}</div>
    ${state.next ? '<button class="btn more" id="moreBtn">Mehr laden</button>' : ""}`;
  list.onclick = (e) => {
    if (e.target.id === "moreBtn") return more();
    const c = e.target.closest(".card"); if (c) openDoc(+c.dataset.id);
  };
}

/* ---------- detail panel ---------- */
async function openDoc(id) {
  let d; try { d = await api("/documents/" + id + "/"); } catch (e) { return toast(e.message); }
  state.open = d;
  const p = $("#panel");
  const isImg = d.mime_type && d.mime_type.startsWith("image/");
  p.innerHTML = `
    <div class="panel-h"><button class="btn ghost" id="pClose">Schließen</button>
      <div class="tabs" role="tablist"><button class="on" data-tab="pv" role="tab">Vorschau</button><button data-tab="tx" role="tab">Inhalt</button></div><span class="sp"></span>
      <a class="btn" href="/api/documents/${d.id}/download/">Herunterladen</a>
      <button class="btn danger" id="pDel">In den Papierkorb</button></div>
    <div class="panel-b">
      <div class="pane">
      ${isImg && !d.has_archive ? `<img class="pv" id="pvEl" src="/api/documents/${d.id}/preview/" alt="">` : `<iframe id="pvEl" src="/api/documents/${d.id}/preview/" title="Vorschau"></iframe>`}
      <pre class="txt ${d.content && d.content.trim() ? "" : "none"}" id="txEl" hidden>${esc(d.content && d.content.trim() ? d.content : "Aus diesem Dokument wurde kein Text ausgelesen.")}</pre>
      </div>
      <div class="side">
        <div><label for="pTitle">Titel</label><input type="text" id="pTitle" value="${esc(d.title)}"></div>
        <div><label for="pCorr">Korrespondent</label><select id="pCorr"><option value="">Keiner</option>${opts(state.corrs, d.correspondent)}</select></div>
        <div><label for="pType">Dokumenttyp</label><select id="pType"><option value="">Keiner</option>${opts(state.types, d.document_type)}</select></div>
        <div><label>Tags</label><div class="tagpick" id="pTags">
          ${state.tags.map(t => `<button data-t="${t.id}" class="${d.tags.includes(t.id) ? "on" : ""}"><i class="dot" style="background:${esc(t.color)}"></i>${esc(t.name)}</button>`).join("") || '<span style="color:var(--muted)">Lege zuerst einen Tag an.</span>'}
        </div></div>
        <div><label>Datei</label><span style="color:var(--muted);font-size:14px">${esc(d.original_filename || "")}<br>Hinzugefügt am ${fmtDate(d.added)}</span></div>
      </div></div>`;
  p.classList.add("on"); $("#veil").classList.add("on");
  $("#pClose").onclick = closePanel;
  $(".tabs", p).onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    $$(".tabs button", p).forEach(x => x.classList.toggle("on", x === b));
    $("#pvEl").hidden = b.dataset.tab !== "pv"; $("#txEl").hidden = b.dataset.tab !== "tx";
  };
  $("#pDel").onclick = async () => {
    try { await api("/documents/" + d.id + "/", { method: "DELETE" }); closePanel(); toast("In den Papierkorb verschoben"); await refreshAll(); loadTrashCount(); }
    catch (e) { toast(e.message); }
  };
  $("#pTitle").onchange = async (e) => save({ title: e.target.value });
  $("#pCorr").onchange = (e) => save({ correspondent: e.target.value ? +e.target.value : null });
  $("#pType").onchange = (e) => save({ document_type: e.target.value ? +e.target.value : null });
  $("#pTags").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const tid = +b.dataset.t; const set = new Set(state.open.tags);
    set.has(tid) ? set.delete(tid) : set.add(tid);
    await save({ tags: [...set] }); b.classList.toggle("on", set.has(tid));
  };
}
async function save(patch) {
  try {
    const r = await api("/documents/" + state.open.id + "/", { method: "PATCH", json: patch });
    Object.assign(state.open, r);
    const i = state.docs.findIndex(x => x.id === r.id); if (i >= 0) state.docs[i] = { ...state.docs[i], ...r };
    renderList(); loadMeta();
  } catch (e) { toast(e.message); }
}
function closePanel() { $("#panel")?.classList.remove("on"); $("#veil")?.classList.remove("on"); const p = $("#panel"); setTimeout(() => { if (p && !p.classList.contains("on")) p.innerHTML = ""; }, 250); }

/* ---------- tags, korrespondenten, dokumenttypen ---------- */
function entityDialog(kind, obj) {
  const K = KINDS[kind], isTag = kind === "tag";
  const algo = obj ? ([0, 1, 6].includes(obj.matching_algorithm) ? obj.matching_algorithm : 1) : 6;
  const dlg = h(`<dialog><form method="dialog" class="row">
    <h3>${obj ? K.one + " bearbeiten" : K.one + " anlegen"}</h3>
    <input type="text" name="name" placeholder="Name" value="${esc(obj?.name || "")}" required>
    ${isTag ? `<div class="colors">${COLORS.map(c => `<input type="radio" name="color" value="${c}" style="--c:${c}" aria-label="${c}" ${(obj?.color || COLORS[0]) === c ? "checked" : ""}>`).join("")}</div>` : ""}
    <select name="algo" aria-label="Automatische Zuordnung">
      <option value="6" ${algo === 6 ? "selected" : ""}>Automatisch lernen aus deinen Zuordnungen</option>
      <option value="1" ${algo === 1 ? "selected" : ""}>Bei bestimmten Wörtern im Dokument</option>
      <option value="0" ${algo === 0 ? "selected" : ""}>Nur von Hand zuordnen</option>
    </select>
    <input type="text" name="match" placeholder="Wörter, durch Leerzeichen getrennt" value="${esc(obj?.match || "")}">
    <small style="color:var(--muted)" id="hintAlgo"></small>
    <div class="err"></div>
    <div class="act">${obj ? '<button type="button" class="btn danger" id="del">Löschen</button>' : ""}<span style="flex:1"></span>
      <button type="button" class="btn" id="cancel">Abbrechen</button><button class="btn primary">Speichern</button></div>
  </form></dialog>`);
  document.body.append(dlg); dlg.showModal();
  const sync = () => {
    const a = +$("[name=algo]", dlg).value;
    $("[name=match]", dlg).style.display = a === 1 ? "" : "none";
    $("#hintAlgo", dlg).textContent = a === 6
      ? "Je mehr Dokumente du von Hand zuordnest, desto besser erkennt Archiv " + K.one + " selbst."
      : a === 1 ? "Wird zugeordnet, sobald eines dieser Wörter im Text vorkommt." : "";
  };
  $("[name=algo]", dlg).onchange = sync; sync();
  $("#cancel", dlg).onclick = () => { dlg.close(); dlg.remove(); };
  if (obj) $("#del", dlg).onclick = async () => {
    if (!confirm(K.one + " „" + obj.name + "“ löschen? Die Dokumente bleiben erhalten.")) return;
    try { await api(K.api + obj.id + "/", { method: "DELETE" }); } catch (e) { return toast(e.message); }
    dlg.close(); dlg.remove(); if (state[K.st] === obj.id) state[K.st] = null; await refreshAll();
  };
  $("form", dlg).onsubmit = async (ev) => {
    ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
    const a = +f.algo, words = (f.match || "").trim();
    if (a === 1 && !words) return ($(".err", dlg).textContent = "Gib mindestens ein Wort an oder wähle eine andere Zuordnung.");
    const body = { name: f.name.trim(), matching_algorithm: a, match: a === 1 ? words : "" };
    if (isTag) body.color = f.color;
    try {
      await api(obj ? K.api + obj.id + "/" : K.api, { method: obj ? "PATCH" : "POST", json: body });
      dlg.close(); dlg.remove(); await refreshAll();
    } catch (e) { $(".err", dlg).textContent = e.message; }
  };
}
async function loadMeta() {
  [state.tags, state.corrs, state.types] = await Promise.all([api("/tags/"), api("/correspondents/"), api("/document_types/")]);
  renderNav(); if (KINDS[state.view]) renderEntities(state.view); if (state.view === "docs") renderFilters();
}
async function refreshAll() { await loadMeta(); await reload(); }

/* ---------- trash ---------- */
async function loadTrashCount() {
  try { const r = await api("/trash/?page_size=1"); state.trashN = r.count; const n = $("#trashN"); if (n) n.textContent = r.count || ""; } catch {}
}
async function renderTrash() {
  const page = $("#page"); let r;
  try { r = await api("/trash/?page_size=200"); } catch (e) { return toast(e.message); }
  state.trashN = r.count; $("#trashN").textContent = r.count || "";
  const head = `<div class="crumb"><h2>Papierkorb</h2><span>${r.count} ${r.count === 1 ? "Dokument" : "Dokumente"}</span><span style="flex:1"></span>
    ${r.count ? '<button class="btn danger" id="emptyAll">Papierkorb leeren</button>' : ""}</div>`;
  if (!r.results.length) {
    page.innerHTML = head + `<div class="empty"><b>Der Papierkorb ist leer</b><span>Gelöschte Dokumente bleiben hier ${r.retention_days} Tage erhalten und lassen sich wiederherstellen.</span></div>`;
    return;
  }
  page.innerHTML = head + `<p class="hint" style="padding-left:0">Gelöschte Dokumente werden nach ${r.retention_days} Tagen endgültig entfernt.</p>
    <div class="grid">${r.results.map(d => `<div class="card static">
      <div class="thumb" style="background-image:url('/api/documents/${d.id}/thumb/?trash=1')"></div>
      <div class="meta"><b>${esc(d.title || d.original_filename)}</b><small>Gelöscht am ${fmtDate(d.deleted_at)}</small></div>
      <div class="tact"><button class="btn" data-restore="${d.id}">Wiederherstellen</button><button class="btn danger" data-purge="${d.id}">Löschen</button></div></div>`).join("")}</div>`;
  page.onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.dataset.restore) { await api("/trash/restore/", { method: "POST", json: { ids: [+b.dataset.restore] } }); toast("Wiederhergestellt"); await loadMeta(); }
      else if (b.dataset.purge) {
        if (!confirm("Dokument endgültig löschen? Das lässt sich nicht rückgängig machen.")) return;
        await api("/trash/empty/", { method: "POST", json: { ids: [+b.dataset.purge] } }); toast("Endgültig gelöscht");
      } else if (b.id === "emptyAll") {
        if (!confirm("Alle " + state.trashN + " Dokumente im Papierkorb endgültig löschen?")) return;
        await api("/trash/empty/", { method: "POST", json: {} }); toast("Papierkorb geleert");
      } else return;
      renderTrash();
    } catch (err) { toast(err.message); }
  };
}

/* ---------- settings ---------- */
function applyPrefs(p) {
  state.pageSize = p.page_size;
  document.documentElement.style.setProperty("--h", p.hue ?? 176);
  if (p.theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = p.theme;
}
function renderSettings(tab) {
  tab = tab || state.settingsTab; state.settingsTab = tab;
  const tabs = [["general", "Allgemein"], ["ocr", "Texterkennung"], ["account", "Konto"]];
  if (state.user.is_admin) tabs.push(["users", "Benutzer"]);
  const page = $("#page");
  page.innerHTML = `<div class="crumb"><h2>Einstellungen</h2></div><div class="set">
    <div class="subnav">${tabs.map(([k, l]) => `<button class="item ${k === tab ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="setBody"></div></div>`;
  page.onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) renderSettings(b.dataset.tab); };
  const body = $("#setBody");
  ({ general: setGeneral, ocr: setOcr, account: setAccount, users: setUsers }[tab])(body).catch(e => toast(e.message));
}
async function setGeneral(el) {
  const p = await api("/preferences/");
  el.innerHTML = `<div class="panelbox"><h3>Darstellung</h3>
    <div class="field"><label for="sTheme">Farbschema</label><select id="sTheme">
      <option value="system">Wie das Gerät</option><option value="light">Hell</option><option value="dark">Dunkel</option></select></div>
    <div class="field"><label for="sSize">Dokumente pro Seite</label><select id="sSize">
      ${[30, 60, 100].map(n => `<option value="${n}">${n}</option>`).join("")}</select></div>
    <div class="field"><label for="sHue">Akzentfarbe</label><input class="hue" id="sHue" type="range" min="0" max="360" step="1" aria-label="Akzentfarbe">
      <small>Schieber bewegen, um die Farbe der Oberfläche zu ändern. <button class="btn ghost" id="hueReset" style="padding:2px 8px">Zurücksetzen</button></small></div></div>`;
  $("#sHue").value = p.hue;
  let ht; $("#sHue").oninput = (e) => { document.documentElement.style.setProperty("--h", e.target.value); clearTimeout(ht); ht = setTimeout(() => save({ hue: +e.target.value }, true), 400); };
  $("#hueReset").onclick = () => { $("#sHue").value = 176; document.documentElement.style.setProperty("--h", 176); save({ hue: 176 }); };
  $("#sTheme").value = p.theme; $("#sSize").value = p.page_size;

  };
  $("#sTheme").onchange = (e) => save({ theme: e.target.value });
  $("#sSize").onchange = (e) => save({ page_size: +e.target.value });
}
async function setOcr(el) {
  const c = await api("/config/"), admin = state.user.is_admin, d = c.defaults;

    <select id="${id}" ${admin ? "" : "disabled"}><option value="">Standard (${esc(map[def] ?? def)})</option>
    ${Object.entries(map).map(([k, v]) => `<option value="${k}" ${String(val) === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>${hint ? `<small>${hint}</small>` : ""}</div>`;
  el.innerHTML = `<form class="panelbox" id="ocrForm"><h3>Texterkennung</h3>

    <div class="field"><label for="oLang">Sprache</label><input type="text" id="oLang" value="${esc(c.language || "")}" placeholder="${esc(d.language)}" ${admin ? "" : "disabled"}>
      <small>Sprachcodes mit + verbinden, zum Beispiel deu+eng. Im Container sind Deutsch (deu) und Englisch (eng) installiert.</small></div>
    ${field("oMode", "Modus", MODE, c.mode, d.mode)}
    ${field("oArch", "Durchsuchbare Archiv-PDF erzeugen", ARCH, c.archive_file_generation, d.archive_file_generation)}
    ${field("oOut", "PDF-Format", OUT, c.output_type, d.output_type)}
    ${field("oSkew", "Schräge Scans begradigen", YN, yn(c.deskew), yn(d.deskew))}
    ${field("oRot", "Seiten automatisch drehen", YN, yn(c.rotate_pages), yn(d.rotate_pages))}
    <div class="err"></div>
    ${admin ? '<div class="act"><small style="color:var(--muted)">Gilt für neu hochgeladene Dokumente.</small><button class="btn primary">Speichern</button></div>' : ""}</form>`;
  if (!admin) return;
  const bool = (v) => v === "" ? null : v === "1";
  $("#ocrForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const nul = (v) => v === "" ? null : v;
    try {
      await api("/config/", { method: "PATCH", json: { language: $("#oLang").value.trim(), mode: nul($("#oMode").value),
        archive_file_generation: nul($("#oArch").value), output_type: nul($("#oOut").value),
        deskew: bool($("#oSkew").value), rotate_pages: bool($("#oRot").value) } });
      $(".err", el).textContent = ""; toast("Gespeichert");
    } catch (e) { $(".err", el).textContent = e.message; }

}
async function setAccount(el) {
  el.innerHTML = `<form class="panelbox" id="pwForm"><h3>Passwort ändern</h3>
    <div class="field"><label for="pwOld">Aktuelles Passwort</label><input type="password" id="pwOld" autocomplete="current-password" required></div>
    <div class="field"><label for="pwNew">Neues Passwort</label><input type="password" id="pwNew" autocomplete="new-password" minlength="8" required><small>Mindestens 8 Zeichen.</small></div>
    <div class="field"><label for="pwNew2">Neues Passwort wiederholen</label><input type="password" id="pwNew2" autocomplete="new-password" required></div>
    <div class="err"></div><div class="act"><button class="btn primary">Passwort ändern</button></div></form>`;
  $("#pwForm").onsubmit = async (ev) => {
    ev.preventDefault();
    if ($("#pwNew").value !== $("#pwNew2").value) return ($(".err", el).textContent = "Die neuen Passwörter stimmen nicht überein.");
    try {
      await api("/account/password/", { method: "POST", json: { current: $("#pwOld").value, new: $("#pwNew").value } });
      ev.target.reset(); $(".err", el).textContent = ""; toast("Passwort geändert");
    } catch (e) { $(".err", el).textContent = e.message; }
  };
}
async function setUsers(el) {
  const r = await api("/users/"), list = r.results || r;
  el.innerHTML = `<div class="panelbox"><h3>Benutzer</h3>
    <div class="users">${list.map(u => `<div><span>${esc(u.username)}${u.is_superuser ? " · Administrator" : ""}</span>
      ${u.id !== state.user.id ? `<button class="btn ghost danger" data-del="${u.id}">Entfernen</button>` : ""}</div>`).join("")}</div>
    <form id="uForm" style="display:grid;gap:10px"><h3 style="margin-top:6px">Benutzer anlegen</h3>
      <input type="text" name="username" placeholder="Benutzername" required>
      <input type="password" name="password" placeholder="Passwort (mind. 8 Zeichen)" required minlength="8" autocomplete="new-password">
      <label><input type="checkbox" name="is_superuser"> Administrator</label><div class="err"></div>
      <div class="act"><button class="btn primary">Benutzer anlegen</button></div></form></div>`;
  el.onclick = async (e) => {
    const b = e.target.closest("[data-del]"); if (!b || !confirm("Benutzer entfernen?")) return;
    try { await api("/users/" + b.dataset.del + "/", { method: "DELETE" }); setUsers(el); } catch (err) { toast(err.message); }
  };
  $("#uForm").onsubmit = async (ev) => {
    ev.preventDefault(); const f = new FormData(ev.target);
    try {
      await api("/users/", { method: "POST", json: { username: f.get("username"), password: f.get("password"), is_superuser: f.has("is_superuser") } });
      toast("Benutzer angelegt"); setUsers(el);
    } catch (e) { $(".err", el).textContent = e.message; }
  };
}

/* ---------- upload ---------- */
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append("files", f));
  if (state.tag) fd.append("tags", state.tag);
  if (state.corr) fd.append("correspondent", state.corr);
  if (state.dtype) fd.append("document_type", state.dtype);
  try {
    await api("/documents/upload/", { method: "POST", body: fd });
    toast(files.length === 1 ? "Wird verarbeitet …" : files.length + " Dateien werden verarbeitet …");
    watchIngest(state.total);
  } catch (e) { toast(e.message); }
}
let watching = false;
async function watchIngest() {
  if (watching) return; watching = true;
  const startCount = (await api("/documents/?page=1&page_size=1")).count; let tries = 0, last = startCount, still = 0;
  state.pending = 1;
  const iv = setInterval(async () => {
    tries++;
    try {
      const c = (await api("/documents/?page=1&page_size=1")).count;
      if (c !== last) { last = c; still = 0; await refreshAll(); } else still++;
    } catch {}
    if (still >= 6 && tries > 6 || tries > 120) { clearInterval(iv); watching = false; state.pending = 0; await refreshAll(); }
  }, 2500);
}
const drop = $("#drop"); let depth = 0;
addEventListener("dragenter", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { depth++; drop.classList.add("on"); } });
addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove("on"); });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); depth = 0; drop.classList.remove("on"); if (state.user) upload([...e.dataTransfer.files]); });

/* ---------- boot ---------- */
async function start() {
  if (!state.user) return;
  shell();
  try { applyPrefs(await api("/preferences/")); } catch {}
  await loadMeta(); await reload(); loadTrashCount();
  $("#scroll").addEventListener("scroll", (e) => { const s = e.target; if (s.scrollTop + s.clientHeight > s.scrollHeight - 400) more(); });
}
(async () => {
  try {
    const s = await api("/auth/session/"); state.csrf = s.csrf;
    if (s.needs_setup) return authScreen(true);
    if (!s.user) return authScreen(false);
    state.user = s.user; await start();
  } catch (e) { $("#root").innerHTML = '<div class="empty"><b>Server nicht erreichbar</b><span>' + esc(e.message) + "</span></div>"; }
})();
</script>
